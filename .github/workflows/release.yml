name: release
# A tag v* builds `cw` for the machines a hill may run on and publishes the
# binaries with their SHA-256 sums as a GitHub release. Linux builds are
# static (musl): they run on any distribution without a Rust toolchain.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Build provenance: `gh attestation verify FILE -R geibos/board-corewar`
  # shows that an archive was built by this workflow from the tagged commit.
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -yq musl-tools
      - name: the tag matches Cargo.toml
        shell: bash
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, Cargo.toml $v"; exit 1; }
      - run: cargo test --release --target ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} --bin cw
      - name: package
        shell: bash
        run: |
          name=cw-$GITHUB_REF_NAME-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/cw README.md LICENSE "$name"/
          "$name/cw" --version
          tar czf "$name.tar.gz" "$name"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: cw-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: cw-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: checksums
        run: sha256sum cw-*.tar.gz > SHA256SUMS && cat SHA256SUMS
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" cw-*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
