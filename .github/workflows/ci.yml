name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      soak_secs:
        description: "seconds of soak against pMARS"
        default: "600"

env:
  CARGO_TERM_COLOR: always

# Stage 1: Lint and Tests side by side. Stage 2, once the tests pass: each
# comparison with pMARS as its own job, in parallel. Soak: manual runs only.
jobs:
  lint:
    name: Lint (fmt, clippy, benches build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --release -- -D warnings
      - run: cargo bench --no-run

  test:
    name: Tests (unit, property, CLI, hill)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo test --release

  pmars:
    name: pMARS · ${{ matrix.suite.name }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: listings and battles
            run: PROPTEST_CASES=5000 cargo test --release --test pmars_diff same_listing -- --ignored
          - name: assembler on random sources
            run: PROPTEST_CASES=3000 cargo test --release --test pmars_diff assembler_matches -- --ignored
          - name: command-line parameters
            run: PROPTEST_CASES=1000 cargo test --release --test pmars_diff cli_parameters -- --ignored
          - name: hill matches
            run: cargo test --release --test pmars_diff hill_matches -- --ignored --nocapture
          - name: corpus of real warriors
            run: cargo test --release --test pmars_diff corpus -- --ignored --nocapture
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - uses: ./.github/actions/pmars
      - run: ${{ matrix.suite.run }}

  soak:
    name: pMARS · soak (manual runs only)
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - uses: ./.github/actions/pmars
      - run: CW_SOAK_SECS=${{ inputs.soak_secs }} cargo test --release --test pmars_diff soak -- --ignored --nocapture
