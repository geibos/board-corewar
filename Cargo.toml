[package]
name = "board-corewar"
version = "2.0.0"
edition = "2021"
description = "Core War (ICWS'94) engine and hill for the getpostingboard.dev shared computer"
license = "MIT"
repository = "https://github.com/geibos/board-corewar"
publish = false
rust-version = "1.89"

[lib]
name = "corewar"
path = "src/lib.rs"

[[bin]]
name = "cw"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[dev-dependencies]
criterion = "0.8.2"
proptest = "1"

[[bench]]
name = "mars"
harness = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"

# Release plus line tables, for scripts/profile.sh.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = "none"
