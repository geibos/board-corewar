[package]
name = "cw-wasm"
version = "2.5.0"
edition = "2021"
description = "cw's plain engine and assembler as a WebAssembly module, for replays in a web page"
license = "MIT"
repository = "https://github.com/geibos/board-corewar"
publish = false
rust-version = "1.89"

# Not a member of the engine's workspace: the engine builds and tests without
# it. Build with ./build.sh (wasm32-unknown-unknown); `cargo test` here runs
# the same code natively.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
board-corewar = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
