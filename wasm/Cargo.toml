[package]
name = "cw-wasm"
version.workspace = true
edition.workspace = true
description = "cw's plain engine and assembler as a WebAssembly module, for replays in a web page"
license.workspace = true
repository.workspace = true
publish = false
rust-version.workspace = true

# A member of the engine's workspace, not a default one: commands at the
# root build and test the engine alone. Build with ./build.sh
# (wasm32-unknown-unknown); `cargo test` here runs the same code natively.
# The release profile is the workspace's (the root Cargo.toml).

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
board-corewar = { path = ".." }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
